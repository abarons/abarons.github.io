<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="{{ site.description | default: site.title }}" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; font-src 'self'; media-src 'self'; upgrade-insecure-requests" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()" />
    <meta name="robots" content="index, follow" />
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/portfolio.css' | relative_url }}" />
  </head>
  <body class="portfolio-body">
    <div class="portfolio-shell">
      <aside class="portfolio-sidebar">
        <div class="Profile-card">
          <h1 class="profile-name">Andrea Barone</h1>
          <p class="role profile-role">Data Platform Engineer</p>
        </div>

        <nav class="side-nav" aria-label="Navigazione principale">
          <button class="nav-item is-active" type="button" data-target="summary">Profile</button>
          <button class="nav-item" type="button" data-target="experience">Experience</button>
          <button class="nav-item" type="button" data-target="skills">Skills</button>
          <button class="nav-item" type="button" data-target="certifications">Certifications</button>
          <button class="nav-item" type="button" data-target="education">Education</button>
          <button class="nav-item" type="button" data-target="projects">Projects</button>
          <button class="nav-item" type="button" data-target="contact">Contact</button>
        </nav>

        <div class="sidebar-meta">
          <p><strong>Location</strong><br/>
            <span class="inline-chip">
              Italy <img src="{{ '/assets/images/Flag_of_Italy.svg' | relative_url }}" width="20" height="20" alt="Italian Flag" />
            </span>
          </p>
          <p><strong>Focus</strong><br/>
            <span class="inline-chip">
              Microsoft <img src="{{ '/assets/images/microsoft.svg' | relative_url }}" width="20" height="20" alt="Microsoft" />
            </span>
            <br/>
            <span class="inline-chip">
              Azure <img src="{{ '/assets/images/azure.svg' | relative_url }}" width="20" height="20" alt="Azure" />
            </span>
            <br/>
            <span class="inline-chip">
              On Premise <img src="{{ '/assets/images/onpremise.svg' | relative_url }}" width="20" height="20" alt="On Premise" />
            </span>
            <br/>
            <span class="inline-chip">
              Cloud <img src="{{ '/assets/images/cloud.svg' | relative_url }}" width="20" height="20" alt="Cloud" />
            </span>
            <br/>
            <span class="inline-chip">
              Analytics <img src="{{ '/assets/images/analytics.svg' | relative_url }}" width="20" height="20" alt="Analytics" />
            </span>
          </p>
        </div>
      </aside>

      <main class="portfolio-main">
        {{ content }}
      </main>
    </div>

    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
